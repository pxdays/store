<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua's Tool Store</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  h1 { color: #58a6ff; font-size: 2em; margin-bottom: 8px; }
  .subtitle { color: #8b949e; margin-bottom: 40px; }
  .tool { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .tool h2 { color: #f0f6fc; margin-bottom: 8px; }
  .tool .desc { color: #8b949e; margin-bottom: 12px; line-height: 1.5; }
  .tool .price { font-size: 1.4em; font-weight: bold; color: #3fb950; }
  .tool .currency { font-size: 0.7em; color: #8b949e; }
  .pay-box { background: #1c2333; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .pay-box h3 { color: #f0f6fc; font-size: 0.9em; margin-bottom: 8px; }
  .pay-box .address { font-family: monospace; font-size: 0.85em; word-break: break-all; background: #0d1117; padding: 10px; border-radius: 4px; color: #58a6ff; cursor: pointer; border: 1px solid #30363d; display: block; margin: 8px 0; user-select: all; }
  .pay-box .steps { font-size: 0.85em; color: #8b949e; margin-top: 8px; line-height: 1.6; }
  .pay-box .steps li { margin-left: 16px; }
  .btn-copy { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85em; }
  .btn-copy:hover { background: #2ea043; }
  .footer { margin-top: 40px; text-align: center; color: #484f58; font-size: 0.8em; }
  .badge { display: inline-block; background: #1f6feb; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; margin-left: 8px; vertical-align: middle; }
  .btn-dl { display: inline-block; background: #1f6feb; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.85em; margin-top: 8px; }
  .btn-dl:hover { background: #388bfd; }
  .copied-msg { color: #3fb950; font-size: 0.85em; margin-left: 8px; }
</style>
</head>
<body>
<div class="container">

<h1>Joshua's Tool Store</h1>
<p class="subtitle">Handy CLI tools to get the job done. Pay with Litecoin, get the full source code + package.</p>

<div id="tools"></div>

<div class="footer">
  <p>Questions? pxdays@users.noreply.github.com</p>
  <p style="margin-top:4px;">All tools include full source code + ready-to-use package.</p>
</div>

</div>

<script>
const LTC_ADDRESS = "LNVJxFNcD5Mn8AjbAHQGpX2EqVDhKfF4sA";

const tools = [
  {
    name: "AI Prompt Manager",
    desc: "Save, organize, and quickly reuse AI prompts. Categorize by model, tag system, search/filter, export to markdown, copy to clipboard. Full terminal UI.",
    price: 12,
    version: "1.0.0",
    file: "ai-prompt-manager-v1.0.0.zip"
  },
  {
    name: "Bulk Image Resizer",
    desc: "Resize hundreds of images at once. Supports jpg, png, webp, avif. Progress bar, folder watch mode, quality settings.",
    price: 15,
    version: "1.0.0",
    file: "bulk-image-resizer-v1.0.0.zip"
  }
];

const container = document.getElementById('tools');
tools.forEach(t => {
  const ltc = (t.price / 100).toFixed(2);
  const safe = t.name.replace(/[^a-zA-Z0-9]/g, '');
  container.innerHTML += `
    <div class="tool">
      <h2>${t.name} <span class="badge">v${t.version}</span></h2>
      <div class="desc">${t.desc}</div>
      <div class="price">$${t.price} <span class="currency">USD</span></div>
      <div style="margin: 10px 0;color:#8b949e;font-size:0.85em;">✅ In stock · delivered within 24h of payment</div>
      <div class="pay-box">
        <h3>Pay with Litecoin</h3>
        <div style="margin: 6px 0;font-size:0.9em;"><strong>Amount:</strong> ~${ltc} LTC</div>
        <div style="font-size:0.85em;margin-bottom:4px;"><strong>Send to:</strong></div>
        <div class="address" id="addr-${safe}">${LTC_ADDRESS}</div>
        <button class="btn-copy" onclick="copyAddr('${safe}')">Copy Address</button>
        <span id="copied-${safe}" class="copied-msg"></span>
        <ol class="steps">
          <li>Send the LTC to the address above</li>
          <li>Email transaction ID to pxdays@users.noreply.github.com</li>
          <li>You'll receive the download link within 24 hours</li>
        </ol>
      </div>
    </div>`;
});

function copyAddr(id) {
  const el = document.getElementById('copied-' + id);
  const text = document.getElementById('addr-' + id).textContent.trim();
  navigator.clipboard.writeText(text).then(() => {
    el.textContent = 'Copied!';
    setTimeout(() => el.textContent = '', 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    el.textContent = 'Copied!';
    setTimeout(() => el.textContent = '', 2000);
  });
}
</script>
</body>
</html>
